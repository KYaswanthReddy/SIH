<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="225" height="80">
  <!-- Lightbulb Graphic -->
  <g transform="translate(10, 10)">
    <!-- Radiating ticks -->
    <line x1="60" y1="5" x2="60" y2="15" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="25" x2="30" y2="33" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="25" x2="90" y2="33" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="65" x2="15" y2="65" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="65" x2="105" y2="65" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Half: Orange Brain Circuits -->
    <path d="M 60,20 C 40,20 25,35 25,55 C 25,72 38,82 45,95 L 45,108 L 60,108 Z" fill="#ea580c"/>
    <path d="M 32,45 Q 40,40 45,50 T 35,65 Q 48,70 50,85 L 58,85" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="45" r="2.5" fill="#ffffff"/>
    <circle cx="35" cy="65" r="2.5" fill="#ffffff"/>
    <circle cx="58" cy="85" r="2.5" fill="#ffffff"/>
    <path d="M 45,30 Q 55,35 52,50 T 42,65" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="30" r="2.5" fill="#ffffff"/>
    <circle cx="42" cy="65" r="2.5" fill="#ffffff"/>

    <!-- Right Half: Green Binary Brain -->
    <path d="M 60,20 C 80,20 95,35 95,55 C 95,72 82,82 75,95 L 75,108 L 60,108 Z" fill="#16a34a"/>
    <text x="64" y="38" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">1010</text>
    <text x="63" y="52" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">01010</text>
    <text x="63" y="66" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">101010</text>
    <text x="63" y="80" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">010101</text>
    <text x="64" y="94" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">10101</text>
    <text x="66" y="106" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">010</text>

    <!-- Bulb Base with SIH text -->
    <path d="M 45,108 L 75,108 L 72,126 L 48,126 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <text x="60" y="122" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">SIH</text>
    <path d="M 50,126 L 70,126 L 66,133 L 54,133 Z" fill="#64748b"/>
    <path d="M 54,133 L 66,133 L 63,137 L 57,137 Z" fill="#334155"/>
  </g>

  <!-- Typography Next to Logo -->
  <text x="145" y="48" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#1e293b" letter-spacing="0.5">SMART INDIA</text>
  <text x="145" y="82" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#1e293b" letter-spacing="0.5">HACKATHON</text>
  <text x="145" y="118" font-family="Arial Black, Impact, sans-serif" font-size="26" font-weight="900" fill="#1e293b" letter-spacing="1">2026</text>
</svg>
